name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The app is cross-platform (Windows / Linux / macOS). systray and parts of
# beeep require cgo, so every job that compiles them runs with CGO_ENABLED=1
# on a native runner (no cross-compilation):
#   windows-latest  - cgo via MinGW-w64 gcc (installed via choco if missing)
#   ubuntu-latest   - cgo via gcc + GTK3 + libayatana-appindicator dev packages
#   macos-latest    - cgo via the system clang, out of the box
#
# CI is the gate that runs on every pull request: it checks formatting, vets,
# runs the hermetic Go test suite, and verifies the app still compiles (and
# cgo-links) on all three OSes. The three build jobs here are compile-only
# checks (no version stamp, no artifact upload) — producing and publishing
# the actual release binaries is release.yml's job, which runs on a v* tag.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
          echo "All files are properly formatted."

      # vet with GOOS=windows: the cgo (GTK/systray) linux backends need dev
      # headers just to type-check, while the windows code paths are pure-Go
      # syscall and vet cleanly without a C toolchain.
      - name: Vet
        run: GOOS=windows go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Install cgo dependencies
        # core (beeep) and tray (systray) are cgo; compiling the test binaries
        # for these packages needs the GTK3 / app-indicator dev headers.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libayatana-appindicator3-dev libgtk-3-dev

      - name: Run tests
        env:
          CGO_ENABLED: 1
        run: go test ./...

  build-windows:
    name: Build check (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Install MinGW-w64 (cgo)
        # cgo needs a C compiler and windows-latest does not guarantee one.
        run: choco install -y mingw

      # Compile-only check: link the real -H windowsgui executable to prove
      # the full cgo build succeeds. No version stamp, no artifact upload.
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
        run: >
          go build -trimpath
          -ldflags "-s -w -H windowsgui"
          -o bin/YealinkNotifier.exe .

  build-linux:
    name: Build check (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Install cgo dependencies
        # systray/beeep link against GTK3 and the app indicator at build time.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libayatana-appindicator3-dev libgtk-3-dev

      # Compile-only check: link the real executable to prove the full cgo
      # build succeeds. No version stamp, no artifact upload.
      - name: Build
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
        run: >
          go build -trimpath
          -ldflags "-s -w"
          -o bin/YealinkNotifier .

  build-darwin:
    name: Build check (Darwin)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      # Compile-only check: link the real executable to prove the full cgo
      # build succeeds. No version stamp, no artifact upload.
      - name: Build
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: amd64
        run: >
          go build -trimpath
          -ldflags "-s -w"
          -o bin/YealinkNotifier .
